name: Bug report
description: Report a reproducible Telemax problem without private account data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste tokens, sessions, phone numbers, account IDs, message text,
        or unredacted logs. Use synthetic replacements in every example.
  - type: input
    id: version
    attributes:
      label: Telemax revision or version
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed and expected behaviour.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Use only synthetic identifiers and content.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, install method, and relevant sanitised settings.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, sessions, personal data, private media, and message content.
          required: true
