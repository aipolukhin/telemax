[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "telemax"
version = "0.1.0"
description = "Personal MAX <-> Telegram bridge: one Telegram bot per MAX dialog"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Leon Polukhin", email = "leon.polukhin@yandex.ru"},
]
requires-python = ">=3.12"
keywords = ["telegram", "max", "bridge", "messaging", "bot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Typing :: Typed",
]
dependencies = [
    # MAX itself is an unofficial API: pin exactly because compatibility may change.
    "maxapi-python==2.3.1",
    # 3.28 is the floor: Managed Bots (getManagedBotToken, ManagedBotUpdated,
    # KeyboardButtonRequestManagedBot, User.can_manage_bots) arrive there, and
    # they are how contact bots are created.
    "aiogram>=3.30",
    # aiogram pulls it in, but the media pipeline uses it directly.
    "aiohttp>=3.14.3",
    "aiosqlite>=0.22",
    # MAX serves avatars as WebP; Telegram takes a bot photo as JPEG only.
    "pillow>=10",
    # A custom sticker reaches MAX only as a PNG (sticker handling), and Telegram sends none:
    # `.tgs` is gzipped Lottie, which rlottie renders, and `.webm` is VP9 with
    # alpha, which PyAV decodes. PyAV carries its own ffmpeg, so the host needs
    # no system one — deliberate, since the deploy target has no root.
    "rlottie-python>=1.3",
    "av>=13",
    "pydantic>=2.13",
    "pyyaml>=6",
    "python-dotenv>=1",
    # Two things need the owner's own Telegram account over MTProto: creating a
    # bot (Bot API has no method, and @BotFather cannot be talked to by another
    # bot) and the owner's user-session intake (`telegram/user_session.py`).
    # Pinned exactly for the same reason as the MAX library: qr_login and the
    # update constructors are a wire surface, not a stable contract.
    "telethon==1.44.0",
    # The terminal QR for the user-session login. Console-only, pure-Python.
    "qrcode==8.2",
    # The console bootstrap. `questionary` for menus and hidden input — a
    # timezone typed by hand was the single most common way to break a config —
    # and `rich` for a layout that survives a 45-column phone terminal.
    "questionary>=2",
    "rich>=13",
    # Reads TZ, /etc/localtime and /etc/timezone in the right order, so the
    # timezone menu can default to the host's own zone.
    "tzlocal>=5",
]

[project.optional-dependencies]
# Kept as an alias: Telethon is a core dependency now, and an install line that
# suddenly fails is a worse welcome than one that does nothing.
mtproto = []
dev = [
    "build>=1.2",
    "pip-audit>=2.9",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[project.scripts]
telemax = "bridge.__main__:main"

[project.urls]
Homepage = "https://github.com/aipolukhin/telemax"
Repository = "https://github.com/aipolukhin/telemax.git"
Issues = "https://github.com/aipolukhin/telemax/issues"
Changelog = "https://github.com/aipolukhin/telemax/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["bridge*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "RUF", "ASYNC", "S", "BLE"]
ignore = [
    "S101",  # asserts are the point in tests
    # User-facing text is Russian; "ambiguous" Cyrillic is the whole alphabet.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests hold fake tokens and use a seeded RNG on purpose.
"tests/*" = ["S105", "S106", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["bridge"]
# PyMax ships py.typed, but mypy 2.x cannot parse parts of it, and we never let
# its types escape the max_client wrapper anyway. Skipping the import keeps the
# strict check on our own code honest without auditing a vendored dependency.
[[tool.mypy.overrides]]
module = ["pymax.*"]
follow_imports = "skip"
ignore_missing_imports = true

# rlottie-python re-exports `LottieAnimation` from a submodule without an
# `__all__`, so a strict check calls the documented public name private.
[[tool.mypy.overrides]]
module = ["rlottie_python.*"]
implicit_reexport = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
